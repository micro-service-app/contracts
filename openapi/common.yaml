openapi: 3.0.3
info:
  title: Multi-ERP Common Components
  version: 0.1.0
paths: {}
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{24}$"
    Search:
      name: search
      in: query
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Decimal:
      type: string
      pattern: "^-?\\d+(\\.\\d{1,4})?$"
      example: "750.00"

    VatRate:
      type: integer
      enum: [1, 10, 20]

    Address:
      type: object
      required: [line, city]
      properties:
        line:
          type: string
        city:
          type: string
        district:
          type: string
        postalCode:
          type: string

    PageMeta:
      type: object
      required: [page, size, totalItems, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: State conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
